name: Install Neovim
description: Download a Neovim release and put its bin/ on PATH.
inputs:
  version:
    description: Release tag to install
    default: v0.11.3
runs:
  using: composite
  steps:
    - name: Install Neovim
      shell: bash
      run: |
        curl -sL https://github.com/neovim/neovim/releases/download/${{ inputs.version }}/nvim-linux-x86_64.tar.gz | tar xz
        echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
