name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        run: |
          curl -sL https://github.com/neovim/neovim/releases/download/v0.11.3/nvim-linux-x86_64.tar.gz | tar xz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Run fast suites
        run: |
          set -e
          for s in gen_spec properties_spec pbt_spec ir_spec substitute_spec macro_spec resolver_spec expander_spec bench_lib_spec trail_spec callers_spec pick_spec; do
            echo "==== tests/$s.lua"
            out=$(nvim --headless --clean -u NONE -c "luafile tests/$s.lua" -c "qa!" 2>&1 | tr '\r' '\n')
            echo "$out"
            echo "$out" | grep -q "TESTS PASSED" || { echo "FAILED: $s (no pass banner)"; exit 1; }
            if echo "$out" | grep -q "FAILURE"; then echo "FAILED: $s"; exit 1; fi
          done

  real-source:
    # Runs on push AND pull_request (unlike perf-regression below): a job
    # gated to `push` only is silently absent from a PR's checks, and GitHub
    # treats an absent required check as satisfied rather than pending or
    # failed -- the same false-green class this branch's whole
    # known_failures pin exists to close. zlib's leg (`allow_skip: "false"`
    # below) is exactly the job whose entire point is proving the pin
    # holds; skipping it on every PR and only ever running it after merge
    # would mean a broken pin is discovered on main, not caught before.
    # The run costs ~2-4 minutes (clone + configure + up to 177 rebuilds);
    # that is not expensive enough to justify leaving PRs unchecked.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # cJSON has no residual known_failures (188/188/188): its own
          # tests hit none of the engine limits zlib's C exercises (goto-based
          # state machines, macros defined later in a file, va_list). It also
          # depends on the network for its clone, so a SKIP: here is allowed
          # -- an offline runner should not fail the build.
          - spec: real_cjson_spec
            name: cJSON
            allow_skip: "true"
          # zlib DOES pin known_failures (an exact set -- see
          # tests/real_zlib_spec.lua), so success here means the pin
          # matched, not that there were zero failures. A SKIP: is NOT
          # allowed: unlike cJSON this job's whole point is to prove the
          # pin holds, and a clone/configure/baseline failure silently
          # reported as SKIP: would otherwise read as green in the exact
          # same way an untested spec would -- indistinguishable from
          # actually having run and passed.
          - spec: real_zlib_spec
            name: zlib
            allow_skip: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        run: |
          curl -sL https://github.com/neovim/neovim/releases/download/v0.11.3/nvim-linux-x86_64.tar.gz | tar xz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Real-source regression (${{ matrix.name }})
        run: |
          out=$(nvim --headless --clean -u NONE -c "luafile tests/${{ matrix.spec }}.lua" -c "qa!" 2>&1 | tr '\r' '\n')
          echo "$out"
          if echo "$out" | grep -q "^SKIP:"; then
            if [ "${{ matrix.allow_skip }}" = "true" ]; then
              echo "SKIPPED (network or toolchain unavailable) -- allowed for ${{ matrix.name }}"
              exit 0
            fi
            echo "FAILED: ${{ matrix.name }} spec printed SKIP: -- not treated as success for this job"
            exit 1
          fi
          if echo "$out" | grep -q "KNOWN-FAILURES PIN"; then
            # This spec pins its residual failures as an exact set (see
            # real_source.lua's known_failures handling): success means the
            # pin matched -- an unlisted failure (regression) or a listed
            # failure that stopped failing (fix nobody updated the list
            # for) both print "KNOWN-FAILURES PIN MISMATCH -- FAILURE"
            # instead of "... PIN OK", so checking for the bare word
            # FAILURE below would not work here -- a pinned, EXPECTED
            # failure also prints in the ordinary FAILURE(S) block above.
            echo "$out" | grep -q "KNOWN-FAILURES PIN OK" || { echo "FAILED: ${{ matrix.name }} known_failures pin mismatch"; exit 1; }
          else
            echo "$out" | grep -q "ALL ACCEPTED TRANSFORMS COMPILE + PASS" || { echo "FAILED: ${{ matrix.name }} spec (no pass banner)"; exit 1; }
            if echo "$out" | grep -q "FAILURE"; then echo "FAILED: ${{ matrix.name }} spec"; exit 1; fi
          fi

  real-kernel:
    # The workload this plugin was actually written for. Every other spec is
    # a proxy, and the proxies hid a real defect for the project's whole
    # life: resolution results were never memoized, so every keystroke
    # reissued workspace/symbol and documentSymbol for a name already
    # resolved. A repeat lookup costs under a millisecond on zlib, so
    # nothing failed; on linux-6.12's kernel/sched/core.c it cost p50
    # 54.6ms, p90 166.0ms and 567.5ms at worst -- the same as the first
    # lookup. Only real kernel source made that visible.
    #
    # Runs on push AND pull_request, for the same reason as real-source: a
    # job absent from a PR's checks is treated by GitHub as satisfied.
    # allow_skip is deliberately absent -- see the SKIP handling below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        run: |
          curl -sL https://github.com/neovim/neovim/releases/download/v0.11.3/nvim-linux-x86_64.tar.gz | tar xz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Install build tools and clangd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bc bison flex libelf-dev clangd
      - name: Cache kernel tree
        id: kcache
        uses: actions/cache@v4
        with:
          # The key pins the tarball AND the object built from it: a change
          # to either must not reuse a tree prepared for the other.
          key: linux-6.12-sched-core-o-v1
          path: kernel-src
      - name: Fetch and build just enough kernel
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p kernel-src && cd kernel-src
          curl -sL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.tar.xz | tar xJ
          cd linux-6.12
          make -s ARCH=x86_64 defconfig
          # One real translation unit is enough to assert the invariant, and
          # building the whole kernel in CI is not. `make compile_commands.json`
          # recurses into targets that rebuild far more than this needs, so the
          # generator script is run directly against the .cmd files instead.
          make -s -j"$(nproc)" kernel/sched/core.o
          python3 scripts/clang-tools/gen_compile_commands.py -d . -o compile_commands.json
      - name: Verify the kernel build produced what the spec needs
        run: |
          set -euo pipefail
          cd kernel-src/linux-6.12
          # `make -s` hides everything, so a build that quietly did nothing
          # still exits 0 and leaves a step marked green. Name the artifacts
          # instead of trusting the exit code: the object, its .cmd file (the
          # compile database is generated from those, not from the object),
          # and a database that actually covers kernel/sched/core.c. A
          # database of host tools only -- which is exactly what a partial
          # kernel build leaves behind -- would let clangd answer from
          # guessed flags, and every measurement would describe something
          # other than kernel source.
          test -f kernel/sched/core.o || { echo "FAILED: kernel/sched/core.o was not built"; exit 1; }
          test -f kernel/sched/.core.o.cmd || { echo "FAILED: no .core.o.cmd -- nothing for the generator to read"; exit 1; }
          python3 - <<'PY'
          import json, sys
          d = json.load(open("compile_commands.json"))
          hits = [e for e in d if e.get("file", "").endswith("kernel/sched/core.c")]
          print(f"compile_commands.json: {len(d)} entries, {len(hits)} covering kernel/sched/core.c")
          if not hits:
              sys.exit("FAILED: compile database does not cover kernel/sched/core.c")
          PY
      - name: Real-kernel regression
        run: |
          out=$(IE_KERNEL_DIR="$PWD/kernel-src/linux-6.12" \
            nvim --headless --clean -u NONE -c "luafile tests/real_kernel_spec.lua" -c "qa!" 2>&1 | tr '\r' '\n')
          echo "$out"
          # A SKIP: is NEVER green here. Everything this spec needs is
          # installed or built in the steps above, so a skip means one of
          # them silently did not produce what it claimed -- a missing
          # clangd, a kernel tree that never unpacked, or a compile database
          # covering no kernel code (the spec checks that last one itself,
          # because a database of host tools only would let clangd guess
          # flags and every result would describe something other than
          # kernel source). Each of those is indistinguishable from a pass
          # if the skip is allowed through.
          if echo "$out" | grep -q "^SKIP:"; then
            echo "FAILED: real-kernel spec printed SKIP: -- everything it needs is provisioned above"
            exit 1
          fi
          echo "$out" | grep -q "ALL REAL KERNEL TESTS PASSED" || { echo "FAILED: real-kernel spec (no pass banner)"; exit 1; }
          if echo "$out" | grep -q "FAILURE"; then echo "FAILED: real-kernel spec"; exit 1; fi

  perf-regression:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        run: |
          curl -sL https://github.com/neovim/neovim/releases/download/v0.11.3/nvim-linux-x86_64.tar.gz | tar xz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Install clangd
        run: |
          curl -sL -o clangd.zip https://github.com/clangd/clangd/releases/download/18.1.3/clangd-linux-18.1.3.zip
          unzip -q clangd.zip
          echo "IE_BENCH_CLANGD=$PWD/clangd_18.1.3/bin/clangd" >> "$GITHUB_ENV"
      - name: Benchmark support unit tests
        run: |
          out=$(nvim --headless --clean -u NONE -c "luafile tests/bench_lib_spec.lua" -c "qa!" 2>&1 | tr '\r' '\n')
          echo "$out"
          echo "$out" | grep -q "ALL BENCH LIB TESTS PASSED" || { echo "FAILED"; exit 1; }
      - name: Performance regression harness
        run: |
          # IE_BENCH_TIMING_GATE=0: a contended CI runner cannot be told apart
          # from a genuine slowdown (both noise-floor populations inflate
          # together, so the noise floor stays small and a steady slowdown
          # would false-FAIL). The structural invariants above are the gate
          # for this job; a timing regression is something a human reads out
          # of this log, not something that turns the job red on its own.
          out=$(IE_BENCH_TIMING_GATE=0 nvim --headless --clean -u NONE -c "luafile tests/bench_spec.lua" -c "qa!" 2>&1 | tr '\r' '\n')
          echo "$out"
          # clangd was just installed above, so a SKIP: here means the harness
          # itself broke, not that clangd is absent -- do not let that pass green.
          echo "$out" | grep -q "ALL BENCH TESTS PASSED" || { echo "FAILED"; exit 1; }
          if echo "$out" | grep -q "FAILURE"; then echo "FAILED"; exit 1; fi
